<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato</title>
</head>

<body>

    <!-- Define o cabeçalho, contendo logotipo e elementos introdutórios. -->
    <header>
        <!-- Agrupa links de navegação principais. -->
        <nav>

            <!-- logo -->
            <img src="../assets/6470430-modelo-de-logotipo-de-animal-de-estimacao-moderno-gratis-vetor.jpg" width="150"
                height="150" alt="Logo do site">

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="paginasHTML/sobre.html">Sobre</a></li>
                <li><a href="paginasHTML/servicos.html">Serviços</a></li>
                <li><a href="paginasHTML/depoimentos.html">Depoimentos</a></li>
                <li><a href="paginasHTML/contato.html">Contato</a></li>
            </ul>

        </nav>

    </header>


    <!-- Delimita o conteúdo central e exclusivo do documento. Deve-se utilizar apenas uma
    instância por página. Este conteúdo é o que muda em cada página. -->
    <main>

        <!-- Conteúdo específico de cada página vai aqui -->

        <form action="" method="post">

            <fieldset>

                <legend> Entre em contato</legend>

                <label for="nome">Digite seunome completo</label>

                <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo">

                <br>

                <label for="email">Digite seu email</label>

                <input type="text" name="email" id="email" placeholder=" seunome@email.com">

                <br>

                <label for="telefone">Digite seu telefone</label>

                <input type="text" name="telefone" id="telefone" pattern="[0-9] {9}" required>

                <br>

                <label for="pet-nome">Digite o nome do seu Pet</label>

                <input type="text" name="pet-nome" id="pet-nome" placeholder="Digite o nome do seu pet:">

                <br>

                <label for="descricao">Descrição</label>

                <input type="text" name="descricao" id="descricao"
                    placeholder="Digite o que seu pet esta sentindo o que ele vai precisar:">


            </fieldset>
        </form>





    </main>

    <!-- Representa o rodapé, com dados de direitos autorais e contatos. -->
    <footer>

        <p>&copy; 2026 Nome do Site. Todos os direitos reservados.</p>

    </footer>

</body>

</html>
