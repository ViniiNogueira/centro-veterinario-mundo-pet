<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="100%" height="100%">
  <defs>
    <style>
      .brand-blue { fill: #009EE3; }
      .brand-red { fill: #E31B23; }
      .brand-white { fill: #FFFFFF; }
      .text-sub {
        font-family: 'Arial Rounded MT Bold', 'VAG Rounded', 'Nunito', 'Ubuntu', sans-serif;
        font-weight: 700;
        font-size: 31px;
        letter-spacing: -0.5px;
      }
      .text-main {
        font-family: 'Arial Rounded MT Bold', 'VAG Rounded', 'Comfortaa', sans-serif;
        font-weight: 900;
        font-size: 96px;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- Subtitle: Centro Veterinário -->
  <text x="18" y="48" class="brand-blue text-sub">Centro Veterinário</text>

  <!-- Red Cross Icon with Paw Print -->
  <g transform="translate(310, 18)">
    <!-- Red Cross -->
    <path class="brand-red" d="
      M 13 0 H 25 A 3 3 0 0 1 28 3 V 13 H 38 A 3 3 0 0 1 41 16 V 28 A 3 3 0 0 1 38 31 H 28 V 41 A 3 3 0 0 1 25 44 H 13 A 3 3 0 0 1 10 41 V 31 H 0 A 3 3 0 0 1 -3 28 V 16 A 3 3 0 0 1 0 13 H 10 V 3 A 3 3 0 0 1 13 0 Z
    " transform="translate(3,0)"/>
    
    <!-- White Paw Print Inside Cross -->
    <g transform="translate(3, 0)">
      <!-- Central Pad -->
      <path class="brand-white" d="M 19 33 C 14 33 13 28 C 16 24.5 C 17.5 23.2 20.5 23.2 22 24.5 C 25 28 24 33 19 33 Z"/>
      <!-- Toes -->
      <ellipse class="brand-white" cx="12.5" cy="21.5" rx="2.2" ry="3.2" transform="rotate(-25 12.5 21.5)"/>
      <ellipse class="brand-white" cx="16.5" cy="17.5" rx="2.2" ry="3.2" transform="rotate(-10 16.5 17.5)"/>
      <ellipse class="brand-white" cx="21.5" cy="17.5" rx="2.2" ry="3.2" transform="rotate(10 21.5 17.5)"/>
      <ellipse class="brand-white" cx="25.5" cy="21.5" rx="2.2" ry="3.2" transform="rotate(25 25.5 21.5)"/>
    </g>
  </g>

  <!-- Main Text: Mund -->
  <text x="12" y="152" class="brand-blue text-main">Mund</text>

  <!-- Globe / Pet Symbol (replaces the 'O' in Mundo) -->
  <g transform="translate(292, 72)">
    <!-- Main Globe Circle -->
    <circle cx="42" cy="42" r="40" class="brand-blue"/>
    
    <!-- Dog Profile (White Cutout Left Side) -->
    <path class="brand-white" d="
      M 10 42 
      C 10 25, 24 12, 42 12 
      C 48 12, 54 14, 59 18 
      C 52 20, 46 25, 43 31 
      C 40 28, 35 27, 30 30 
      C 24 33, 22 40, 25 46 
      C 20 48, 16 53, 17 60 
      C 22 55, 27 54, 32 56 
      C 28 64, 34 71, 42 72 
      C 24 72, 10 58, 10 42 Z
    "/>

    <!-- Pet Profile & Orbital Arc (White Details Right Side) -->
    <path class="brand-white" d="
      M 48 24 
      C 56 26, 64 32, 68 40 
      C 70 44, 71 50, 69 55 
      C 66 50, 61 46, 55 45 
      C 58 39, 56 32, 48 24 Z
    "/>
    
    <!-- Dynamic Globe Arc Lines -->
    <path d="M 14 52 Q 42 68 70 52" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 60 18 Q 42 35 24 22" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Main Text: Pet -->
  <text x="390" y="152" class="brand-blue text-main">Pet</text>
</svg>
